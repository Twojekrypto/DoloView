name: Verify historical Borrow P&L
on:
  push:
    branches: [master]
    paths: [.github/workflows/publish-borrow-pnl.yml, scripts/recovery_borrow_pnl.py, .github/workflows/collect-verified-pnl.yml, fetch_borrow_position_pnl.py, build_borrow_position_pnl.py, borrow_pnl_activity.py, borrow_pnl_oracle_recovery.py]
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/collect-verified-pnl.yml
    permissions:
      actions: read
      contents: read
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Publish the verified data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-recovery-data.yml --repo "$GITHUB_REPOSITORY" --ref master
