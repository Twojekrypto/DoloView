name: Verify public DOLO, veDOLO and oDOLO data

on:
  workflow_dispatch:
    inputs:
      family:
        description: Feed to verify
        type: choice
        default: all
        options:
          - all
          - dolo-holders
          - dolo-flows
          - vedolo-inventory
          - odolo-flow
          - odolo-activity
          - odolo-contract
          - early-exits
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.feeds.outputs.matrix }}
    steps:
      - id: feeds
        env:
          FAMILY: ${{ inputs.family || 'all' }}
        run: |
          feeds='[
            {"family":"dolo-holders","minutes":112,"checkpoint":"dolo_holders_state.json"},
            {"family":"dolo-flows","minutes":178,"checkpoint":"dolo_flows_state.json"},
            {"family":"vedolo-inventory","minutes":140,"checkpoint":"locked_cache.json\nvedolo_vote_power_history_state.json"},
            {"family":"odolo-flow","minutes":120,"checkpoint":"odolo_flows_state.json\nodolo_flow_checkpoints\nreward_claim_events_state.json"},
            {"family":"odolo-activity","minutes":75,"checkpoint":"exercisers_cache.json"},
            {"family":"odolo-contract","minutes":12,"checkpoint":""},
            {"family":"early-exits","minutes":80,"checkpoint":"early_exits_cache.json"}
          ]'
          selected=$(jq -ce --arg family "$FAMILY" '{include:map(select($family == "all" or .family == $family))} | select(.include|length > 0)' <<< "$feeds")
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"
  collect:
    needs: select
    name: Verify ${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    concurrency:
      group: verified-token-feeds-${{ matrix.family }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest tests.test_recovery_token_feeds
      - name: Restore private incremental scan state
        id: state
        if: ${{ matrix.checkpoint != '' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.checkpoint }}
          key: token-feed-v1-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: token-feed-v1-${{ matrix.family }}-
      - name: Reuse verified veDOLO history before Pages is updated
        if: matrix.family == 'vedolo-inventory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior=$(gh run list --workflow publish-vedolo-flows.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$prior" ]; then
            gh run download "$prior" --name verified-vedolo-flows --dir "$RUNNER_TEMP/vedolo-flows" ||
              echo "::warning::Reading previously published veDOLO history"
          fi
      - name: Collect and validate the public feed
        env:
          FAMILY: ${{ matrix.family }}
          ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC_CZ9 || secrets.ALCHEMY_BERACHAIN_RPC }}
          ALCHEMY_ETHEREUM_RPC: ${{ secrets.ALCHEMY_ETHEREUM_RPC }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BERASCAN_API_KEY: ${{ secrets.BERASCAN_API_KEY }}
          PYTHONUNBUFFERED: '1'
          REWARD_CLAIM_CHAINS: berachain
          REWARD_CLAIM_CHUNK_SIZE_BERACHAIN: '10000'
          REWARD_CLAIM_TIMESTAMP_BATCH_SIZE_BERACHAIN: '20'
          VEDOLO_MAX_RUNTIME_SECONDS: '2200'
          DOLO_FLOWS_LOG_CHUNK_DELAY_SECONDS: '0.5'
        run: |
          python3 scripts/recovery_token_feeds.py build "$FAMILY" "$RUNNER_TEMP/verified-token-feeds-$FAMILY.zip" \
            --vedolo-flow-input "$RUNNER_TEMP/vedolo-flows/vedolo_flows.json"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-token-feeds-${{ matrix.family }}
          path: ${{ runner.temp }}/verified-token-feeds-${{ matrix.family }}.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Request publication of the verified feed
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-recovery-data.yml --repo "$GITHUB_REPOSITORY" --ref master
      - name: Save incremental scan progress
        if: ${{ always() && steps.state.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ matrix.checkpoint }}
          key: ${{ steps.state.outputs.cache-primary-key }}
