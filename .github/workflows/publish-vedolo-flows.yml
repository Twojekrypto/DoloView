name: Verify veDOLO lock and unlock history
on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
permissions:
  contents: read
concurrency:
  group: verified-vedolo-flows
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest tests.test_generate_vedolo_flows tests.test_recovery_vedolo_flows
      - run: python3 scripts/recovery_vedolo_flows.py prepare
      - name: Restore unfinished receipt and event checkpoints
        id: state
        uses: actions/cache/restore@v5
        with:
          path: vedolo_flows_state.json
          key: verified-vedolo-flow-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: verified-vedolo-flow-
      - name: Verify onchain event history
        env:
          ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC_CZ9 }}
          PYTHONUNBUFFERED: '1'
        run: python3 generate_vedolo_flows.py --max-runtime-seconds 3600
      - name: Save checkpoints even when the scan is incomplete
        if: ${{ always() && steps.state.outcome == 'success' && hashFiles('vedolo_flows_state.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: vedolo_flows_state.json
          key: ${{ steps.state.outputs.cache-primary-key }}
      - run: |
          python3 validate_data.py vedolo_flows.json
          python3 scripts/recovery_vedolo_flows.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: verified-vedolo-flows
          path: vedolo_flows.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Publish the verified data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-recovery-data.yml --repo "$GITHUB_REPOSITORY" --ref master
