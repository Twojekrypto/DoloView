name: Verify public Earn Merkl rewards
on:
  workflow_dispatch:
  schedule:
    - cron: '22 * * * *'
  push:
    branches: [master]
    paths: [.github/workflows/publish-earn-merkl.yml, scripts/recovery_merkl.py, build_earn_merkl_rewards_cache.py]
permissions:
  contents: read
concurrency:
  group: earn-merkl-public
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m pip install requests
      - run: python3 -m unittest tests.test_build_earn_merkl_rewards_cache tests.test_recovery_merkl
      - name: Guard — detect Merkl campaigns outside the eligible-market list
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from build_earn_merkl_rewards_cache import ELIGIBLE_MARKETS
          CHAINS = {"ethereum": 1, "arbitrum": 42161, "berachain": 80094}
          missing = []
          for chain, cid in CHAINS.items():
              url = f"https://api.dolomite.io/tokens/{cid}/interest-rates?exclude-odolo=false"
              req = urllib.request.Request(url, headers={"User-Agent": "dolomite-dashboard-ci"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      payload = json.load(resp)
              except Exception as exc:
                  print(f"::warning title=Merkl guard::{chain}: API unreachable ({exc})")
                  continue
              eligible = {a.lower() for a in (ELIGIBLE_MARKETS.get(chain) or {})}
              for row in payload.get("interestRates", []):
                  token = row.get("token") or {}
                  addr = str(token.get("tokenAddress") or "").lower()
                  for part in (row.get("outsideSupplyInterestRateParts") or []):
                      if "merkl" in str(part.get("label") or "").lower() and addr not in eligible:
                          missing.append((chain, token.get("tokenSymbol"), addr, part.get("label")))
          for m in missing:
              print(f"::warning title=New Merkl campaign not in ELIGIBLE_MARKETS::{m}")
          print("Merkl guard:", f"{len(missing)} uncovered campaign(s)" if missing else "all campaigns covered")
          PY

      - name: Fetch and verify the full Ethereum wallet scope
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/recovery_merkl.py build verified-earn-merkl.zip
      - uses: actions/upload-artifact@v4
        with:
          name: verified-earn-merkl
          path: verified-earn-merkl.zip
          retention-days: 1
          compression-level: 0
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-recovery-data.yml --repo "$GITHUB_REPOSITORY" --ref master
