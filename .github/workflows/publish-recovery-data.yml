name: Publish DoloView recovery data

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-recovery-data.yml
      - scripts/build_recovery_pages_data.py
      - scripts/recovery_market_feeds.py
      - scripts/recovery_cadence.py
      - fetch_dolo_price_history.py
      - scripts/recovery_borrow_feeds.py
  workflow_dispatch:
    inputs:
      refresh_pnl:
        description: 'Collect a new P&L snapshot before publication'
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: recovery-data-pages-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-pnl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      collect: ${{ steps.age.outputs.collect }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m pip install requests
      - id: age
        name: Check the source time of the available P&L
        env:
          FORCE_PNL: ${{ inputs.refresh_pnl }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$FORCE_PNL" = true ]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prior=$(gh run list --workflow publish-borrow-pnl.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$prior" ]; then
            gh run download "$prior" --name verified-borrow-pnl --dir "$RUNNER_TEMP/pnl" || echo "::warning::Checking the published P&L instead"
          fi
          collect=$(python3 scripts/recovery_borrow_pnl.py check-age "$RUNNER_TEMP/pnl/verified-borrow-pnl.zip")
          echo "P&L needs a fresh collection: $collect"
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
  refresh-pnl:
    needs: check-pnl
    if: needs.check-pnl.outputs.collect == 'true'
    uses: ./.github/workflows/collect-verified-pnl.yml
    permissions:
      contents: read
      actions: read
  build:
    needs: [check-pnl, refresh-pnl]
    if: ${{ !cancelled() && needs.check-pnl.result == 'success' && (needs.refresh-pnl.result == 'success' || needs.refresh-pnl.result == 'skipped') }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 32
    outputs:
      failed_feeds: ${{ steps.markets.outputs.failed_feeds }}
      bundle_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Check out data producers
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install producer dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Verify TVL validators
        run: python3 -m unittest tests.test_fetch_dolomite_tvl tests.test_fetch_dolomite_total_supply_history
      - name: Refresh and stage validated snapshots
        run: python3 scripts/build_recovery_pages_data.py _data
      - name: Verify price, asset icon and WLFI producers
        run: |
          python3 -m unittest discover -s tests -p 'test_assets_*classification.py'
          python3 -m unittest discover -s tests -p 'test_assets_market_coverage.py'
          python3 -m unittest discover -s tests -p 'test_wlfi_markets.py'
          python3 -m unittest discover -s tests -p 'test_recovery_market_feeds.py'
      - name: Build supporting market feeds
        id: markets
        run: |
          python3 scripts/recovery_market_feeds.py _data "$RUNNER_TEMP/failed-feeds.json"
          python3 -m unittest tests.test_recovery_borrow_feeds tests.test_borrow_earnings
          python3 -m unittest discover -s tests -p 'test_borrow_risk_*.py'
          python3 scripts/recovery_borrow_feeds.py _data "$RUNNER_TEMP/failed-feeds.json"
          echo "failed_feeds=$(cat "$RUNNER_TEMP/failed-feeds.json")" >> "$GITHUB_OUTPUT"
      - name: Include independently verified supply history, pool health and rewards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reports_run=$(gh run list --workflow publish-market-reports.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$reports_run" ]; then
            gh run download "$reports_run" --name verified-supply-reports --dir "$RUNNER_TEMP/reports" || echo "::warning::Reading previously published report bundle"
          fi
          python3 scripts/recovery_reports.py stage "$RUNNER_TEMP/reports/verified-supply-reports.zip" --output _data
      - name: Include verified Ethereum Merkl rewards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior=$(gh run list --workflow publish-earn-merkl.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$prior" ]; then
            gh run download "$prior" --name verified-earn-merkl --dir "$RUNNER_TEMP/merkl" || echo "::warning::Reading previously published Merkl rewards"
          fi
          python3 scripts/recovery_merkl.py stage "$RUNNER_TEMP/merkl/verified-earn-merkl.zip" _data
      - name: Include independently verified historical Borrow P&L
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTED: ${{ needs.refresh-pnl.result }}
        run: |
          if [ "$COLLECTED" = success ]; then
            gh run download "$GITHUB_RUN_ID" --name verified-borrow-pnl --dir "$RUNNER_TEMP/pnl"
          else
            prior=$(gh run list --workflow publish-borrow-pnl.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$prior" ]; then
              gh run download "$prior" --name verified-borrow-pnl --dir "$RUNNER_TEMP/pnl" || echo "::warning::Reading previously published P&L"
            fi
          fi
          python3 scripts/recovery_borrow_pnl.py stage "$RUNNER_TEMP/pnl/verified-borrow-pnl.zip" --output _data
      - name: Identify this verified Pages publication
        run: python3 -c 'import json,os,pathlib; pathlib.Path("_data/publisher.json").write_text(json.dumps({"run":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"]}))'
      - name: Upload data for Pages
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: _data

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish snapshots
        id: publish
        uses: actions/deploy-pages@v5
      - name: Report feeds that retained their previous data
        if: needs.build.outputs.failed_feeds != '[]'
        env:
          FAILED_FEEDS: ${{ needs.build.outputs.failed_feeds }}
        run: |
          echo "::error::Previous data retained for $FAILED_FEEDS"
          exit 1

  release-staging-space:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Release only this run's transport artifact after public readback
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
        run: |
          set -euo pipefail
          for delay in 1 2 4 8 16 32; do
            if curl -fsS "https://twojekrypto.github.io/DoloView/publisher.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$delay" |
               jq -e --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '.run == $run and .attempt == $attempt' >/dev/null; then
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" |
                jq -e --arg id "$BUNDLE_ID" '.artifacts | any((.id|tostring) == $id and .name == "github-pages")' >/dev/null
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$BUNDLE_ID"
              exit 0
            fi
            sleep "$delay"
          done
          echo "::warning::Readback could not confirm this run yet; Pages artifact kept for its one-day retention"

  catch-up:
    needs: [deploy, refresh-pnl]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Catch up overdue collectors without retry loops
        env:
          GH_TOKEN: ${{ github.token }}
          PNL_COLLECTED_HERE: ${{ needs.refresh-pnl.result }}
        run: |
          python3 -m unittest tests.test_recovery_cadence
          python3 scripts/recovery_cadence.py
